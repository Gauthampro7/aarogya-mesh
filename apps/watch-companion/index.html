<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aarogya Mesh — Tier-0 Watch Companion</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        background: #020617;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .watch-bezel {
        width: 360px;
        height: 360px;
        border-radius: 50%;
        border: 8px solid #1e293b;
        background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
        box-shadow: 0 0 40px rgba(13, 148, 136, 0.25);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 24px 26px;
        box-sizing: border-box;
        text-align: center;
      }
      .top-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .mode-pill,
      .nav-pill {
        border: 1px solid #0d9488;
        background: #042f2e;
        color: #5eead4;
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 0.7rem;
        font-weight: 700;
        cursor: pointer;
      }
      .nav-pill {
        border-color: #334155;
        background: #0f172a;
        color: #e2e8f0;
      }
      .panel {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .panel[hidden] {
        display: none;
      }
      .actions,
      .card-actions {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card-actions {
        flex-direction: row;
        justify-content: center;
      }
      .primary-action {
        width: 100%;
        border: none;
        border-radius: 999px;
        padding: 9px 14px;
        font-weight: 700;
        cursor: pointer;
        background: #dc2626;
        color: #ffffff;
      }
      .secondary-action,
      .mini-btn {
        width: 100%;
        border: 1px solid #0f766e;
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        background: #042f2e;
        color: #ccfbf1;
      }
      .mini-btn {
        width: auto;
        padding: 5px 10px;
        font-size: 0.7rem;
      }
      .mini-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .priority-badge {
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 0.65rem;
        font-weight: 800;
        color: #ffffff;
        background: #dc2626;
      }
      .card-summary {
        margin: 0;
        font-size: 0.76rem;
        color: #cbd5e1;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .meta {
        font-size: 0.68rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="watch-bezel" role="application" aria-label="Tier-0 Watch Companion 360x360">
      <div class="top-bar">
        <button id="mode-toggle" class="mode-pill" type="button">MODE: CHW_COMPANION</button>
        <button id="view-cards-btn" class="nav-pill" type="button">Cards (0)</button>
      </div>

      <section id="screen-view" class="panel">
        <div>
          <h1 id="watch-title" style="margin: 0; font-size: 0.98rem">1-Tap Danger Screen</h1>
          <p id="watch-summary" style="margin: 6px 0 0; font-size: 0.76rem; color: #cbd5e1">
            Offline Tier-0 Kernel · Ready for ASHA household screening.
          </p>
        </div>
        <div class="actions">
          <button id="primary-btn" class="primary-action" type="button">
            Flag Danger Sign (RED)
          </button>
          <button id="safe-btn" class="secondary-action" type="button">
            No Danger Signs (GREEN)
          </button>
        </div>
      </section>

      <section id="cards-view" class="panel" hidden>
        <span id="card-priority-badge" class="priority-badge">CLEAR</span>
        <h2 id="card-title" style="margin: 0; font-size: 0.95rem">No Active Cards</h2>
        <p id="card-summary" class="card-summary">
          Pending cards from Phone/Hub will appear here.
        </p>
        <div class="card-actions">
          <button id="card-ack-btn" class="mini-btn" type="button">Ack</button>
          <button id="card-done-btn" class="mini-btn" type="button">Done</button>
          <button id="card-next-btn" class="mini-btn" type="button">Next</button>
        </div>
      </section>

      <div id="watch-footer" class="meta">TIER_0_WATCH · 0 queued · 0 cards</div>
    </div>

    <script type="module" src="./dist/watch.js"></script>
  </body>
</html>
